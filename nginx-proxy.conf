# =========================================
# HTTP -> HTTPS REDIRECT
# =========================================
server {
    listen 80;
    server_name schooly.learnup.tn *.schooly.learnup.tn minio.learnup.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# =========================================
# SCHOOLY (ADMIN + VITRINES)
# =========================================
server {
    listen 443 ssl;
    server_name schooly.learnup.tn *.schooly.learnup.tn;
    client_max_body_size 5G;

    ssl_certificate /etc/letsencrypt/live/schooly.learnup.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schooly.learnup.tn/privkey.pem;

    resolver 127.0.0.11 valid=5s;

    location / {
        set $front schooly-front;
        proxy_pass http://$front:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $back schooly-back;
        proxy_pass http://$back:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /swagger-ui/ {
        set $back schooly-back;
        proxy_pass http://$back:8083/swagger-ui/;
    }

    location /v3/api-docs {
        set $back schooly-back;
        proxy_pass http://$back:8083;
    }

    location /ws {
        set $back schooly-back;
        proxy_pass http://$back:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# =========================================
# MINIO (presigned URLs + console)
# =========================================
server {
    listen 443 ssl;
    server_name minio.learnup.tn;
    client_max_body_size 5G;

    ssl_certificate /etc/letsencrypt/live/minio.learnup.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.learnup.tn/privkey.pem;

    resolver 127.0.0.11 valid=5s;

    location / {
        set $minio minio;
        proxy_pass http://$minio:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
